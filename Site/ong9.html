  .avatar{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--kelp),var(--tide));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:22px}

<body class="tide-bg">

    <aside class="sidebar">

        <div><span class="brand-name">Eco‑Urbs</span><span class="brand-tag">Litoral Limpo</span></div>

      <div class="nav-label">Painel</div>
      <nav class="side-nav">

        <a href="ong3.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.2 2.2L16 10"/></svg><span>Locais ativos</span></a>
        <a href="ong4.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg><span>Registrar ação</span></a>
        <a href="ong5.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="18" cy="9" r="2.4"/><path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.3"/></svg><span>Voluntários</span></a>
        <a href="ong7.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a7.5 7.5 0 0 1-11.3 6.5L4 19l1.1-4.2A7.5 7.5 0 1 1 21 11.5z"/></svg><span>Comunicação</span></a>

      <div class="sidebar-foot">
        <div class="nav-label" style="margin-top:0">Conta</div>
        <a href="ong9.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg><span>Meu perfil</span></a>
        <a href="login.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Sair</span></a>
      </div>
    </aside>

    <main class="main" style="max-width:760px">
      <div class="page-head">
        <div>
          <span class="eyebrow">Conta</span>
          <h1>Perfil da ONG</h1>
          <p>Mantenha os dados institucionais atualizados.</p>
        </div>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">
          <div class="avatar">V</div>
          <div>
            <strong style="font-family:'Fraunces',serif;font-size:16px;color:var(--ink)">VerdeMar ONG</strong>
            <div class="small">Cadastrada desde 2023</div>
          </div>
        </div>

        <form onsubmit="salvarOng(event)">
          <label for="nome">Nome oficial</label>
          <input id="nome" value="VerdeMar ONG" required>
          <label for="cnpj">CNPJ</label>
          <input id="cnpj" value="12.345.678/0001-90" required>
          <label for="resp">Responsável Técnico</label>
          <input id="resp" value="Julio Cesar Alves da Silva" required>
          <label for="cidades">Cidades de Atuação</label>
          <input id="cidades" value="Mongaguá, Praia Grande, Itanhaém">

          <div style="display:flex;gap:10px;margin-top:20px">
            <button type="submit" class="btn">Salvar alterações</button>
            <button type="button" class="btn subtle" onclick="location.reload()">Restaurar</button>
          </div>
        </form>
      </div>

      <footer>Projeto Litoral Limpo — Área da ONG · 2025</footer>
    </main>
  </div>

  <script src="LitoralState.js"></script>
  <script src="demo-bar.js"></script>
  <script>
    function salvarOng(e) {
      e.preventDefault();
      const state = LitoralState.getState();
      state.ong.nome = document.getElementById('nome').value;
      state.ong.cnpj = document.getElementById('cnpj').value;
      state.ong.responsavel = document.getElementById('resp').value;
      localStorage.setItem('litoral_limpo_state_v1', JSON.stringify(state));
      LitoralState.toast('Dados institucionais da ONG atualizados!', 'success');
    }
  </script>
</body>
</html>
